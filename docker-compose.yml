services:

  postgres:
    image: postgres:16

    container_name: orders-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    container_name: orders-api

    depends_on:
      - postgres

    env_file:
      - .env

    ports:
      - "8000:8000"

volumes:
  postgres_data: